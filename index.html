/* ===================================================================
   KQL NORMALISER + QUERY API (pure functions, no DOM)
   The checker never runs a query. It tokenises it, then compares a
   canonical form:
     - comments removed, whitespace ignored
     - keywords/identifiers compared case-insensitively ("cols" on an
       exercise adds a separate, case-sensitive check for table/column names)
     - 'single' and "double" quoted strings are the same
     - timespans canonicalised: 1h == 60m == 3600s, 1d == 24h
     - synonyms: limit → take, sort → order, filter → where
     - aliases (X = count()) are ignored when comparing aggregations
     - "where a and b" == "where a | where b"
   =================================================================== */
const TS_UNITS = {d:86400, day:86400, days:86400, h:3600, hr:3600, hrs:3600, hour:3600, hours:3600,
  m:60, min:60, minute:60, minutes:60, s:1, sec:1, second:1, seconds:1,
  ms:0.001, milli:0.001, millis:0.001, millisecond:0.001, milliseconds:0.001};
const KQL_HYPHEN = new Set(["make-series","project-away","project-rename","project-reorder","project-keep",
  "mv-expand","mv-apply","parse-where","top-nested","top-hitters","parse-kv"]);
const SYN = {limit:"take", sort:"order", filter:"where"};

function kqlTokens(src){
  const out = [], s = String(src || "").replace(/\r/g, "");
  let i = 0;
  while (i < s.length){
    const ch = s[i];
    if (/\s/.test(ch)){ i++; continue; }
    if (ch === "/" && s[i + 1] === "/"){ while (i < s.length && s[i] !== "\n") i++; continue; }
    if (ch === '"' || ch === "'" || (ch === "@" && (s[i + 1] === '"' || s[i + 1] === "'"))){
      const verb = ch === "@"; let j = verb ? i + 1 : i; const q = s[j]; j++; let v = "";
      while (j < s.length && s[j] !== q && s[j] !== "\n"){
        if (!verb && s[j] === "\\" && j + 1 < s.length){ v += s[j] + s[j + 1]; j += 2; continue; }
        v += s[j]; j++;
      }
      out.push({t:"s", v:'"' + v.toLowerCase() + '"', o:v}); i = j + 1; continue;
    }
    if (/\d/.test(ch)){
      const m = s.slice(i).match(/^(\d+(?:\.\d+)?)([a-zA-Z]+)?/);
      let v = m[0].toLowerCase();
      const u = m[2] && m[2].toLowerCase();
      if (u && TS_UNITS[u] !== undefined) v = "ts:" + (+(parseFloat(m[1]) * TS_UNITS[u]).toFixed(6));
      out.push({t:"n", v, o:m[0]}); i += m[0].length; continue;
    }
    if (/[A-Za-z_$]/.test(ch) || (ch === "!" && /[A-Za-z]/.test(s[i + 1] || ""))){
      const m = s.slice(i).match(/^!?[A-Za-z_$][\w$]*/);
      let v = m[0].toLowerCase(), o = m[0]; i += m[0].length;
      const h = s.slice(i).match(/^\s*-\s*([A-Za-z]+)/);
      if (h && KQL_HYPHEN.has(v + "-" + h[1].toLowerCase())){ v += "-" + h[1].toLowerCase(); o += "-" + h[1]; i += h[0].length; }
      out.push({t:"w", v, o}); continue;
    }
    const m3 = s.slice(i).match(/^(==|!=|=~|!~|>=|<=|\.\.)/);
    const p = m3 ? m3[0] : ch;
    out.push({t:"p", v:p, o:p}); i += p.length;
  }
  return out;
}
const isWordTok = t => t.t === "w" || t.t === "n";
function kjoin(toks){
  let o = "";
  toks.forEach((t, k) => { if (k && isWordTok(t) && isWordTok(toks[k - 1])) o += " "; o += t.v; });
  return o;
}
function ksplit(toks, isSep){
  const parts = [[]]; let d = 0;
  for (const t of toks){
    if (t.t === "p" && "([{".includes(t.v)) d++;
    if (t.t === "p" && ")]}".includes(t.v)) d--;
    if (d === 0 && isSep(t)){ parts.push([]); continue; }
    parts[parts.length - 1].push(t);
  }
  return parts.filter(p => p.length);
}
// Canonical compact form of a snippet (used for the expected side of checks)
const K = s => kjoin(kqlTokens(s));
function stripParens(s){
  while (s.startsWith("(") && s.endsWith(")")){
    let d = 0, ok = true;
    for (let i = 0; i < s.length; i++){
      if (s[i] === "(") d++; else if (s[i] === ")") d--;
      if (d === 0 && i < s.length - 1){ ok = false; break; }
    }
    if (!ok) break;
    s = s.slice(1, -1);
  }
  return s;
}
function stripAlias(it){
  if (it.length > 2 && it[0].t === "w" && it[1].t === "p" && it[1].v === "=") return {alias:it[0].v, toks:it.slice(2)};
  return {alias:null, toks:it};
}
function mkStage(toks){
  toks = toks.slice();
  if (toks[0] && toks[0].t === "w" && SYN[toks[0].v]) toks[0] = {...toks[0], v:SYN[toks[0].v]};
  const st = {op: toks[0] ? toks[0].v : "", toks, s: kjoin(toks)};
  if (st.op === "where") st.preds = ksplit(toks.slice(1), t => t.t === "w" && t.v === "and").map(p => stripParens(kjoin(p)));
  if (st.op === "summarize"){
    const rest = toks.slice(1); let d = 0, idx = -1;
    rest.forEach((t, k) => {
      if (t.t === "p" && "([{".includes(t.v)) d++;
      if (t.t === "p" && ")]}".includes(t.v)) d--;
      if (d === 0 && idx < 0 && t.t === "w" && t.v === "by") idx = k;
    });
    const aggT = idx < 0 ? rest : rest.slice(0, idx), byT = idx < 0 ? [] : rest.slice(idx + 1);
    const items = ts => ksplit(ts, t => t.t === "p" && t.v === ",").map(stripAlias);
    st.aggs = items(aggT).map(x => kjoin(x.toks));
    st.aliases = items(aggT).map(x => x.alias).filter(Boolean);
    st.by = items(byT).map(x => kjoin(x.toks));
  }
  if (st.op === "extend" || st.op === "project"){
    st.items = ksplit(toks.slice(1), t => t.t === "p" && t.v === ",").map(stripAlias).map(x => ({alias:x.alias, e:kjoin(x.toks)}));
  }
  // first parenthesised sub-query (join / union / lookup)
  const open = toks.findIndex(t => t.t === "p" && t.v === "(");
  if (["join","lookup","union"].includes(st.op) && open >= 0){
    let d = 0, close = -1;
    for (let k = open; k < toks.length; k++){
      if (toks[k].t === "p" && toks[k].v === "(") d++;
      if (toks[k].t === "p" && toks[k].v === ")"){ d--; if (d === 0){ close = k; break; } }
    }
    if (close > open) st.subToks = toks.slice(open + 1, close);
  }
  return st;
}
function kqlApi(src){
  const toks = Array.isArray(src) ? src : kqlTokens(src);
  const stmts = ksplit(toks, t => t.t === "p" && t.v === ";");
  const lets = {}, pieces = [];
  let main = [], all = [];
  stmts.forEach(st => {
    let body = st, prefix = "";
    if (st[0].t === "w" && st[0].v === "let" && st[1] && st[2] && st[2].t === "p" && st[2].v === "="){
      body = st.slice(3); prefix = "let " + st[1].v + "=";
      lets[st[1].v] = kjoin(body);
    }
    const stages = ksplit(body, t => t.t === "p" && t.v === "|").map(mkStage);
    all = all.concat(stages);
    pieces.push(prefix + stages.map(s => s.s).join("|"));
    if (!prefix) main = stages;
  });
  const alts = a => (Array.isArray(a) ? a : [a]).map(K);
  const ops = main.map(s => s.op);
  const api = {
    src: String(Array.isArray(src) ? kjoin(src) : src), toks, lets, main, all, ops,
    c: pieces.join(";"),
    table: main[0] ? main[0].s : "",
    // compact text contains any of the snippets
    inc: (...a) => a.flatMap(x => alts(x)).some(x => pieces.join(";").includes(x)),
    st: op => main.filter(s => s.op === op),
    idx: op => ops.indexOf(op),
    lastIdx: op => ops.lastIndexOf(op),
    // some where predicate (anywhere, incl. let statements) equals one of the alternatives
    where: (...a) => { const want = a.flatMap(x => alts(x)); return all.some(s => s.op === "where" && s.preds.some(p => want.includes(p))); },
    whereRe: re => all.some(s => s.op === "where" && s.preds.some(p => re.test(p))),
    // index of the first main-pipeline where stage containing a matching predicate
    whereIdx: re => main.findIndex(s => s.op === "where" && s.preds.some(p => re.test(p))),
    // summarize with these aggregations (each an alternative list) and exactly these by-columns (order-free)
    sum(aggs, by){
      return main.some(s => {
        if (s.op !== "summarize") return false;
        if (!aggs.every(a => s.aggs.some(x => alts(a).includes(x)))) return false;
        if (by === undefined) return true;
        if (s.by.length !== by.length) return false;
        const left = s.by.slice();
        return by.every(b => { const i = left.findIndex(x => alts(b).includes(x)); if (i < 0) return false; left.splice(i, 1); return true; });
      });
    },
    sumStage: () => main.find(s => s.op === "summarize"),
    // sorted descending by col: order by col [desc] or top N by col [desc]
    sortedDesc: col => main.some(s =>
      (s.op === "order" && [K(`order by ${col}`), K(`order by ${col} desc`)].includes(s.s)) ||
      (s.op === "top" && new RegExp(`^top \\d+ by ${K(col).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}( desc)?$`).test(s.s))),
    sortedAsc: col => main.some(s => s.op === "order" && s.s === K(`order by ${col} asc`)),
    limited: n => main.some(s => s.s === K(`take ${n}`) || new RegExp(`^top ${n} by `).test(s.s)),
    render: kind => main.some(s => s.op === "render" && (s.s === "render " + kind || s.s.startsWith("render " + kind + " "))),
    before: (a, b) => { const i = ops.indexOf(a); return i >= 0 && ops.lastIndexOf(b) > i; },
    sub: op => { const s = main.find(x => x.op === op && x.subToks); return s ? kqlApi(s.subToks) : kqlApi(""); }
  };
  return api;
}
// common equivalent predicates
const TIME = (col, span) => [`${col} > ago(${span})`, `${col} >= ago(${span})`, `ago(${span}) < ${col}`, `${col} between (ago(${span}) .. now())`];
const FAILED = col => [`${col} == false`, `${col} == "False"`, `not(${col})`, `${col} != true`, `${col} == 0`];

/* ===================================================================
   CHECKING (pure functions, no DOM: also used by the self-test)
   =================================================================== */
const norm = s => String(s).trim().replace(/\s+/g, " ").toLowerCase();
const normFill = s => norm(s).replace(/\s*([^\w\s])\s*/g, "$1").replace(/'/g, '"');

function caseCheck(ex, toks){
  const want = new Map(ex.cols.map(c => [c.toLowerCase(), c]));
  // names the user defines (aliases / let) are theirs to spell: X = …
  const own = new Set(toks.filter((t, k) => t.t === "w" && toks[k + 1] && toks[k + 1].t === "p" && toks[k + 1].v === "=").map(t => t.o));
  const bad = [...new Set(toks.filter(t => t.t === "w" && want.has(t.v) && t.o !== want.get(t.v) && !own.has(t.o)).map(t => `${t.o} → ${want.get(t.v)}`))];
  return {l:`Table and column names use the exact casing (${ex.cols.join(", ")})`, ok: bad.length === 0, sub: bad};
}

// Returns {ok, results:[{l, ok, sub?}], marks}
function grade(ex, ans){
  switch (ex.type){
    case "mc": {
      const ok = ans === ex.answer;
      return {ok, results:[{l: ans === null || ans === undefined ? "Pick an answer first." : ok ? "Correct!" : "Not quite. Read the hint and try again.", ok}]};
    }
    case "multi": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = [];
      if (ok) r.push({l:"Correct! You found exactly the right options.", ok:true});
      else {
        r.push({l: missing ? `${missing} correct option${missing > 1 ? "s" : ""} not selected` : "All correct options selected", ok: !missing});
        r.push({l: extra ? `${extra} selected option${extra > 1 ? "s are" : " is"} wrong` : "No wrong options selected", ok: !extra});
      }
      return {ok, results:r};
    }
    case "order": {
      const seq = ans || [];
      const marks = seq.map((it, pos) => it === pos);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.items.length;
      return {ok, marks, results:[{l: ok ? "Correct order!" : `${right}/${ex.items.length} items are in the right position.`, ok}]};
    }
    case "match": {
      const sel = ans || [];
      const marks = ex.rows.map((r, i) => sel[i] === r[1]);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.rows.length;
      return {ok, marks, results:[{l: ok ? "All matches correct!" : `${right}/${ex.rows.length} matches correct.`, ok}]};
    }
    case "fill": {
      const vals = ans || [];
      const marks = ex.blanks.map((acc, i) => acc.some(a => normFill(a) === normFill(vals[i] || "")));
      const right = marks.filter(Boolean).length;
      const ok = right === ex.blanks.length;
      return {ok, marks, results:[{l: ok ? "All blanks correct!" : `${right}/${ex.blanks.length} blanks correct.`, ok}]};
    }
    case "lines": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = ok ? [{l:"Correct! You spotted exactly the right lines.", ok:true}] : [
        {l: missing ? `${missing} line${missing > 1 ? "s" : ""} still to find` : "You found every faulty line", ok: !missing},
        {l: extra ? `${extra} selected line${extra > 1 ? "s are" : " is"} actually fine` : "No correct lines selected by mistake", ok: !extra}];
      return {ok, results:r};
    }
    case "kql": {
      const text = String(ans || "").replace(/\r/g, "");
      const q = kqlApi(text);
      const results = [];
      results.push({l:"Query is not empty and starts with a table (or a let statement)", ok: q.main.length > 0 && /^[a-z_]/.test(q.table) && !q.table.startsWith("|")});
      for (const c of ex.checks){
        let ok = false;
        try { ok = !!c.t(q); } catch (e) { ok = false; }
        results.push({l:c.l, ok});
      }
      if (ex.cols) results.push(caseCheck(ex, q.toks));
      return {ok: results.every(r => r.ok), results};
    }
  }
  return {ok:false, results:[]};
}

function modelAnswer(ex){
  switch (ex.type){
    case "mc": return ex.answer;
    case "multi": case "lines": return ex.answer.slice();
    case "order": return ex.items.map((_, i) => i);
    case "match": return ex.rows.map(r => r[1]);
    case "fill": return ex.blanks.map(b => b[0]);
    case "kql": return ex.solution;
  }
}

function scramble(id, n){
  let seed = 0; for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.reverse();
  return a;
}

const ALL_EX = MODULES.flatMap(m => m.exercises);

/* ===================================================================
   HIGHLIGHTER (tiny, dependency-free)
   =================================================================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KQL_KW = new Set(("let where project project-away project-rename project-keep extend summarize by order sort asc desc take limit top join kind on " +
  "render make-series from to step default union and or has !has contains !contains startswith endswith in !in between count distinct mv-expand parse with " +
  "inner innerunique leftouter rightouter fullouter leftanti rightanti leftsemi rightsemi timechart barchart columnchart piechart areachart scatterchart linechart table " +
  "true false lookup search as nulls first last isfuzzy filter").split(" "));
const KQL_TABLES = /^(requests|dependencies|exceptions|traces|pageViews|customEvents|customMetrics|availabilityResults|performanceCounters|browserTimings|App[A-Z]\w*|Perf|Heartbeat|AzureActivity|AzureDiagnostics|AzureMetrics|InsightsMetrics|Event|Syslog|ContainerLogV2|KubePodInventory|KubeEvents|Usage)$/;
function hlKql(code){
  const re = /(\/\/.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?(?:ms|min|d|h|m|s)?\b)|(!?[A-Za-z_$][\w$]*(?:-(?:series|away|rename|keep|expand))?)(\s*\()?|(\||==|!=|=~|>=|<=)/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += `<span class="tc">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="ts">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tn">${esc(m[3])}</span>`;
    else if (m[4]){
      const w = m[4];
      if (m[5]) out += `<span class="td">${esc(w)}</span>${esc(m[5])}`;
      else if (KQL_KW.has(w.toLowerCase())) out += `<span class="tk">${esc(w)}</span>`;
      else if (KQL_TABLES.test(w)) out += `<span class="tt">${esc(w)}</span>`;
      else out += esc(w);
    }
    else out += `<span class="tdash">${esc(m[6])}</span>`;
  }
  return out + esc(code.slice(last));
}
function hlText(code){
  return code.split("\n").map(line => {
    const m = line.match(/^(.*?)(\s+#\s.*)?$/);
    return esc(m[1]).replace(/\b([0-9a-f]{16,32})\b/g, '<span class="td">$1</span>') + (m[2] ? `<span class="tc">${esc(m[2])}</span>` : "");
  }).join("\n");
}
function highlight(code, lang){ return lang === "text" ? hlText(code) : hlKql(code); }
function codeBlock(code, lang){
  return `<div class="codewrap"><pre><code>${highlight(code, lang || "kql")}</code></pre><button class="copy">Copy</button></div>`;
}
// schema helper used in exercise text
function sch(table, cols){
  return `<div class="schema"><span class="sname">${table}</span>${cols.map(c => { const [n, t] = c.split(":"); return `<span class="col">${n}${t ? `<i>${t}</i>` : ""}</span>`; }).join("")}</div>`;
}

/* ===================================================================
   UI
   =================================================================== */
const KIND = {mc:"Single choice", multi:"Select all that apply", order:"Put in order", match:"Match", fill:"Fill in the blanks", lines:"Spot the error", kql:"Write the query"};
const LS = "telemetryLab:";

function startApp(){
  const store = {
    get(k, d){ try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} }
  };
  let done = store.get("done", []).filter(id => ALL_EX.some(e => e.id === id));
  let current = Math.min(store.get("current", 0), MODULES.length - 1);
  const $ = s => document.querySelector(s);
  const state = {};
  const modDone = m => m.exercises.filter(e => done.includes(e.id)).length;

  function renderNav(){
    let html = "", lastGroup = "";
    MODULES.forEach((m, i) => {
      if (m.group !== lastGroup){ html += `<div class="group">${m.group}</div>`; lastGroup = m.group; }
      const n = modDone(m), all = n === m.exercises.length;
      const cls = [i === current ? "active" : "", all ? "done" : ""].join(" ");
      html += `<button class="${cls}" data-i="${i}"><span class="num">${all ? "✓" : i + 1}</span>${m.title}<span class="cnt">${n}/${m.exercises.length}</span></button>`;
    });
    $("#nav").innerHTML = html;
    $("#bar").style.width = (done.length / ALL_EX.length * 100) + "%";
    $("#ptext").textContent = `${done.length} of ${ALL_EX.length} exercises completed`;
  }

  function bodyHtml(ex){
    const sid = ex.id;
    switch (ex.type){
      case "mc": case "multi":
        return `<div class="opts">${ex.options.map((o, i) =>
          `<label class="opt" data-i="${i}"><input type="${ex.type === "mc" ? "radio" : "checkbox"}" name="${sid}" value="${i}"><span>${o}</span></label>`).join("")}</div>`;
      case "order":
        return `<ol class="order" id="ol-${sid}"></ol>`;
      case "match":
        return `<table class="match">${ex.rows.map((r, i) =>
          `<tr data-i="${i}"><td>${r[0]}</td><td><select aria-label="Answer ${i + 1}"><option value="">— choose —</option>${ex.choices.map(c => `<option>${esc(c)}</option>`).join("")}</select></td></tr>`).join("")}</table>`;
      case "fill": {
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => {
          const w = Math.max(6, ...ex.blanks[+n].map(b => b.length)) + 2;
          return `<input data-b="${n}" size="${w}" aria-label="Blank ${+n + 1}" autocomplete="off" spellcheck="false">`;
        });
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines":
        return `<div class="lines${ex.prose ? " prose" : ""}">${ex.code.map((l, i) =>
          `<div class="ln" data-i="${i}" role="button" tabindex="0"><span class="no">${i + 1}</span><span>${esc(l) || " "}</span></div>`).join("")}</div>`;
      case "kql":
        return `<textarea class="kqled" spellcheck="false" aria-label="KQL query editor"></textarea>
          <p class="edhelp">Tab inserts 2 spaces · Ctrl+Enter checks your answer · your draft is saved automatically · the checker forgives keyword casing and spacing, but the real Log Analytics engine is case-sensitive</p>`;
    }
  }

  function solutionHtml(ex){
    switch (ex.type){
      case "mc": return `<p><b>Answer:</b> ${ex.options[ex.answer]}</p>`;
      case "multi": return `<ul class="tips">${ex.answer.map(i => `<li>${ex.options[i]}</li>`).join("")}</ul>`;
      case "order": return `<ol class="tips">${ex.items.map(t => `<li>${t}</li>`).join("")}</ol>`;
      case "match": return `<div class="tablewrap"><table class="ref">${ex.rows.map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table></div>`;
      case "fill": {
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => `<b><u>${esc(ex.blanks[+n][0])}</u></b>`);
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines": return `<p>Faulty line${ex.answer.length > 1 ? "s" : ""}: ${ex.answer.map(i => `<b>${i + 1}</b>`).join(", ")}</p>`;
      case "kql": return codeBlock(ex.solution, "kql");
    }
  }

  function wireExercise(ex, root){
    const id = ex.id;
    const q = s => root.querySelector(s);
    const draftKey = "draft:" + id;

    if (ex.type === "mc"){
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => { state[id] = +inp.value; clearMarks(); });
      state[id] = null;
    }
    if (ex.type === "multi"){
      state[id] = [];
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        state[id] = [...root.querySelectorAll("input:checked")].map(x => +x.value); clearMarks();
      });
    }
    if (ex.type === "order"){
      state[id] = scramble(id, ex.items.length);
      const ol = q(".order");
      let dragFrom = null;
      const draw = (marks) => {
        ol.innerHTML = state[id].map((it, pos) =>
          `<li draggable="true" data-pos="${pos}" class="${marks ? (marks[pos] ? "right" : "wrong") : ""}"><span class="pos">${pos + 1}</span><span class="txt">${ex.items[it]}</span>
            <span class="mv"><button class="btn small" data-mv="-1" ${pos === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="btn small" data-mv="1" ${pos === ex.items.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button></span></li>`).join("");
      };
      const move = (from, to) => { const a = state[id]; const [x] = a.splice(from, 1); a.splice(to, 0, x); draw(); };
      ol.onclick = e => {
        const b = e.target.closest("button[data-mv]"); if (!b) return;
        const pos = +b.closest("li").dataset.pos, to = pos + +b.dataset.mv;
        if (to >= 0 && to < ex.items.length) move(pos, to);
      };
      ol.addEventListener("dragstart", e => { const li = e.target.closest("li"); if (li){ dragFrom = +li.dataset.pos; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", ""); } catch {} } });
      ol.addEventListener("dragover", e => { if (dragFrom !== null) e.preventDefault(); });
      ol.addEventListener("drop", e => { e.preventDefault(); const li = e.target.closest("li"); if (li && dragFrom !== null) move(dragFrom, +li.dataset.pos); dragFrom = null; });
      ol.addEventListener("dragend", () => { dragFrom = null; });
      root._draw = draw;
      draw();
    }
    if (ex.type === "match"){
      state[id] = ex.rows.map(() => "");
      root.querySelectorAll("select").forEach((s, i) => s.onchange = () => { state[id][i] = s.value; s.closest("tr").className = ""; });
    }
    if (ex.type === "fill"){
      state[id] = ex.blanks.map(() => "");
      root.querySelectorAll(".fill input").forEach(inp => {
        inp.oninput = () => { state[id][+inp.dataset.b] = inp.value; inp.className = ""; };
        inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); check(); } };
      });
    }
    if (ex.type === "lines"){
      state[id] = [];
      const toggle = el => {
        const i = +el.dataset.i, a = state[id];
        if (a.includes(i)) a.splice(a.indexOf(i), 1); else a.push(i);
        root.querySelectorAll(".ln").forEach(l => l.className = "ln" + (a.includes(+l.dataset.i) ? " sel" : ""));
      };
      root.querySelectorAll(".ln").forEach(el => {
        el.onclick = () => toggle(el);
        el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(el); } };
      });
    }
    if (ex.type === "kql"){
      const ed = q("textarea");
      const saved = store.get(draftKey, null);
      ed.value = saved !== null ? saved : ex.starter;
      state[id] = ed.value;
      const save = () => { state[id] = ed.value; store.set(draftKey, ed.value); };
      const insert = t => {
        ed.focus();
        if (!document.execCommand || !document.execCommand("insertText", false, t)){
          const s = ed.selectionStart, en = ed.selectionEnd;
          ed.value = ed.value.slice(0, s) + t + ed.value.slice(en);
          ed.selectionStart = ed.selectionEnd = s + t.length;
          save();
        }
      };
      ed.addEventListener("input", save);
      ed.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); return; }
        if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); insert("  "); }
      });
    }

    function clearMarks(){ root.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong")); }

    function check(){
      const g = grade(ex, state[id]);
      if (ex.type === "mc" || ex.type === "multi"){
        clearMarks();
        const sel = ex.type === "mc" ? (state[id] === null ? [] : [state[id]]) : state[id];
        sel.forEach(i => root.querySelector(`.opt[data-i="${i}"]`).classList.add(
          (ex.type === "mc" ? i === ex.answer : ex.answer.includes(i)) ? "right" : "wrong"));
      }
      if (ex.type === "order") root._draw(g.marks);
      if (ex.type === "match") root.querySelectorAll(".match tr").forEach((tr, i) => tr.className = g.marks[i] ? "right" : "wrong");
      if (ex.type === "fill") root.querySelectorAll(".fill input").forEach(inp => inp.className = g.marks[+inp.dataset.b] ? "right" : "wrong");
      if (ex.type === "lines") root.querySelectorAll(".ln").forEach(l => {
        const i = +l.dataset.i, sel = state[id].includes(i);
        l.className = "ln" + (sel ? (ex.answer.includes(i) ? " right" : " wrong") : "");
      });
      q(".results").innerHTML = g.results.map(r =>
        `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} ${esc(r.l)}${(r.sub || []).map(s => `<span class="sub">↳ ${esc(s)}</span>`).join("")}</li>`).join("") +
        (ex.type === "kql" ? `<li class="${g.ok ? "pass" : "fail"}"><b>${g.results.filter(r => r.ok).length}/${g.results.length} checks passed${g.ok ? ". Nice work! 🎉" : ""}</b></li>` : "");
      if (g.ok){
        q(".why").style.display = "block";
        if (!done.includes(id)){ done.push(id); store.set("done", done); renderNav(); }
        root.classList.add("solved");
      }
    }

    q(".checkBtn").onclick = check;
    q(".hintBtn").onclick = () => { const h = q(".hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };
    q(".solBtn").onclick = e => {
      const s = q(".solution"), show = s.style.display !== "block";
      s.style.display = show ? "block" : "none";
      q(".why").style.display = show || root.classList.contains("solved") ? "block" : "none";
      e.target.textContent = show ? "Hide solution" : "Show solution";
    };
    q(".resetBtn").onclick = () => {
      if (ex.type === "kql") store.set(draftKey, null);
      const fresh = document.createElement("section");
      root.replaceWith(fresh);
      buildExercise(ex, fresh);
    };
  }

  function buildExercise(ex, el){
    const n = ALL_EX.indexOf(ex) + 1;
    el.className = "exercise" + (done.includes(ex.id) ? " solved" : "");
    el.id = "ex-" + ex.id;
    el.innerHTML = `
      <h3>🧪 ${n}. ${ex.title} <span class="kind">${ex.fix ? "Fix the query" : KIND[ex.type]}</span> <span class="badge">Completed</span></h3>
      <div>${ex.q}</div>
      ${bodyHtml(ex)}
      <div class="btns">
        <button class="btn primary checkBtn">Check my answer</button>
        <button class="btn hintBtn">Hint</button>
        <button class="btn solBtn">Show solution</button>
        <button class="btn resetBtn">Reset</button>
      </div>
      <div class="hint">💡 ${ex.hint}</div>
      <ul class="results"></ul>
      <div class="solution"><p class="solhead">Model answer</p>${solutionHtml(ex)}</div>
      <div class="why"><b>Why:</b> ${ex.why}</div>`;
    wireExercise(ex, el);
  }

  function renderModule(){
    const m = MODULES[current];
    const sections = m.sections.map(s => `
        <h3>${s.h}</h3>
        ${s.p ? `<p>${s.p}</p>` : ""}
        ${s.code ? codeBlock(s.code, s.lang) : ""}
        ${s.after || ""}`).join("");

    $("#content").innerHTML = `
      <span class="tag">Module ${current + 1} of ${MODULES.length} · ${m.tag}</span>
      <h2>${m.title}</h2>
      <p class="lead">${m.intro}</p>
      ${sections}
      ${m.tip ? `<div class="note exam">🎯 <b>AZ-400 exam tip:</b> ${m.tip}</div>` : ""}
      <h3 style="margin-top:36px">Exercises (${m.exercises.length})</h3>
      <div id="exlist"></div>
      <div class="navfoot">
        <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="nextBtn" ${current === MODULES.length - 1 ? "disabled" : ""}>Next →</button>
      </div>`;
    const list = $("#exlist");
    m.exercises.forEach(ex => { const el = document.createElement("section"); list.appendChild(el); buildExercise(ex, el); });
    $("#prevBtn").onclick = () => go(current - 1);
    $("#nextBtn").onclick = () => go(current + 1);
    renderNav();
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0 || i >= MODULES.length) return;
    current = i; store.set("current", i);
    $("#side").classList.remove("open");
    renderModule();
  }

  $("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  document.addEventListener("click", e => {
    if (!e.target.classList.contains("copy")) return;
    const text = e.target.previousElementSibling.innerText;
    navigator.clipboard?.writeText(text).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); });
  });
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
  };
  $("#resetAllBtn").onclick = () => {
    if (!confirm("Reset all progress and saved drafts for this lab?")) return;
    done = []; store.set("done", done);
    ALL_EX.filter(e => e.type === "kql").forEach(e => store.set("draft:" + e.id, null));
    renderModule();
  };
  const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t;

  renderModule();
}

if (typeof document !== "undefined" && document.getElementById("content")) startApp();
