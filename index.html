<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Analysis Practice Lab</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#e1e5ec;
  --accent:#0f6cbd; --accent-soft:#e6f0fa; --ok:#127a3c; --ok-soft:#e5f5eb; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#a35200; --warn-soft:#fdf1e3;
  --code-bg:#0f1720; --code-text:#d6dde8;
  --k:#7cc4ff; --s:#f2b880; --c:#7d8a9c; --d:#d7a6ff; --n:#9fe3a8; --t:#6fd6c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
    --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
    --warn:#f0b450; --warn-soft:#2b2112;
    --code-bg:#0a0d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --text:#e3e8ef; --muted:#9aa4b2; --line:#2a313c;
  --accent:#4ea1f3; --accent-soft:#16283c; --ok:#4cc27a; --ok-soft:#13281c; --bad:#ff7b72; --bad-soft:#2d1615;
  --warn:#f0b450; --warn-soft:#2b2112;
  --code-bg:#0a0d12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;margin:0 8px 4px}
aside .sub{color:var(--muted);font-size:13px;margin:0 8px 14px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:0 8px 6px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:12px;color:var(--muted);margin:0 8px 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--accent-soft)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
nav button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.sidefoot{margin:18px 8px 0;display:grid;gap:10px;justify-items:start}
.sidefoot a{font-size:13px;color:var(--accent)}
.theme{font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:32px 40px 80px;max-width:980px;width:100%}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
h2{font-size:28px;margin:0 0 8px}
h3{font-size:19px;margin:28px 0 8px}
p{margin:8px 0}
.lead{color:var(--muted);font-size:17px}
:not(pre)>code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.9em;overflow-wrap:anywhere}
.codewrap{position:relative;margin:12px 0}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55;margin:0}
.file{font-size:12px;color:var(--muted);margin:12px 0 -6px;font-family:Consolas,monospace}
.copy{position:absolute;top:8px;right:8px;font-size:12px;background:#ffffff1a;color:#cfd8e3;border:0;border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{background:#ffffff33}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .td{color:var(--d)} .tn{color:var(--n)} .tt{color:var(--t)}
.tdash{color:var(--c)}
ul.tips,ol.tips{padding-left:20px} .tips li{margin:4px 0}
table.ref{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--accent-soft);font-weight:600}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:15px}
.note.exam{border-left-color:var(--warn);background:var(--warn-soft)}
.exercise{margin-top:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.exercise h3{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exercise h3 .kind{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
.exercise h3 .badge{font-size:12px;background:var(--ok);color:#fff;border-radius:20px;padding:2px 10px;display:none}
.exercise.solved h3 .badge{display:inline-block}
.exercise.solved{border-color:var(--ok)}
textarea{width:100%;min-height:220px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--line);border-radius:10px;
  padding:14px;font-size:14px;line-height:1.55;resize:vertical;tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea.short{min-height:120px;white-space:pre-wrap}
textarea:focus{border-color:var(--accent)}
.edhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:2px 9px;font-size:13px}
.results{list-style:none;padding:0;margin:10px 0}
.results li{padding:6px 12px;border-radius:7px;margin:4px 0;font-size:14px}
.results li.pass{background:var(--ok-soft);color:var(--ok)}
.results li.fail{background:var(--bad-soft);color:var(--bad)}
.results li .sub{display:block;font-size:13px;margin:2px 0 0 18px;opacity:.9}
.hint{display:none;background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:15px;margin:8px 0}
.why{display:none;border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.solution{display:none;margin:10px 0}
.solution .solhead{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
/* choice */
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* order */
.order{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.order li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.order li .pos{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.order li .txt{flex:1}
.order li .mv{display:flex;gap:4px}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* match */
.match{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
.match td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.match td:first-child{width:58%}
.match select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.match tr.right td{background:var(--ok-soft)}
.match tr.wrong td{background:var(--bad-soft)}
/* fill */
.fill{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;line-height:2.3}
.fill.mono{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre-wrap;line-height:2.2}
.fill input{font:inherit;font-size:14px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:90px}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* lines */
.lines{background:var(--code-bg);border-radius:10px;padding:8px 0;margin:12px 0;overflow:auto}
.lines .ln{display:flex;gap:12px;padding:2px 14px;cursor:pointer;color:var(--code-text);font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:14px;white-space:pre;border-left:3px solid transparent}
.lines .ln:hover{background:#ffffff12}
.lines .ln .no{color:var(--c);user-select:none;min-width:20px;text-align:right}
.lines .ln.sel{background:#f2b88026;border-left-color:var(--s)}
.lines .ln.right{background:#4cc27a2e;border-left-color:var(--n)}
.lines .ln.wrong{background:#ff7b7230;border-left-color:#ff7b72}
.lines.prose .ln{font-family:inherit;white-space:normal}
.navfoot{display:flex;justify-content:space-between;margin-top:30px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100vh}
  aside.open{transform:none;box-shadow:0 0 40px #0006}
  main{padding:16px 16px 60px}
  .menu{display:inline-block;margin-bottom:12px}
  h2{font-size:23px}
  .match td{display:block;width:100% !important;border:0;padding:4px 6px}
  .match tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
}
.schema{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px}
.schema .sname{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-weight:700;color:var(--accent);margin-right:6px}
.schema .col{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.schema .col i{font-style:normal;color:var(--muted);margin-left:5px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px}
textarea.kqled{min-height:170px}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>Telemetry Analysis Lab</h1>
    <p class="sub">AZ-400 · 5.2 Analyzing metrics and logs</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="ptext" id="ptext"></p>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="theme" id="themeBtn">Toggle theme</button>
      <button class="theme" id="resetAllBtn">Reset progress</button>
      <a href="../azure-pipelines-tutorial/index.html">Open the Azure Pipelines Practice Lab</a>
      <a href="../bicep-tutorial/index.html">Open the Bicep Practice Lab</a>
      <a href="../I.1%20-%20flow-of-work-trainer/index.html">Open the Flow of Work Lab</a>
    </div>
  </aside>
  <main>
    <button class="btn menu" id="menuBtn">☰ Modules</button>
    <div id="content"></div>
  </main>
</div>

<script>

/* ===================================================================
   MODULE DATA
   Exercise types (all share: id, title, q, hint, why):
     mc     options[], answer: index
     multi  options[], answer: [indexes]
     order  items[] in the CORRECT order (shown shuffled)
     match  rows: [[left html, correct choice]], choices[]
     fill   tpl with [[0]], [[1]]… blanks, blanks: [[accepted…]]  (first = shown in solution)
     lines  code: [lines], answer: [line indexes]
     kql    starter, checks: [{l, t: q => bool}], solution, cols?: exact-case names,
            accept?: [equivalent answers that must pass], reject?: [answers that must fail]
            (accept/reject are only used by the self-test)
   =================================================================== */
const S_REQUESTS = ["timestamp:datetime","name:string","url:string","duration:real (ms)","resultCode:string","success:bool","operation_Id:string","operation_ParentId:string","id:string","cloud_RoleName:string","user_Id:string","itemCount:int"];
const S_DEPS = ["timestamp:datetime","name:string","target:string","type:string","data:string","duration:real (ms)","resultCode:string","success:bool","operation_Id:string","operation_ParentId:string","id:string","cloud_RoleName:string"];
const S_EXC = ["timestamp:datetime","type:string","outerMessage:string","problemId:string","severityLevel:int","operation_Id:string","cloud_RoleName:string"];
const S_TRACES = ["timestamp:datetime","message:string","severityLevel:int","operation_Id:string","cloud_RoleName:string","customDimensions:dynamic"];
const S_PERF = ["TimeGenerated:datetime","Computer:string","ObjectName:string","CounterName:string","InstanceName:string","CounterValue:real"];

const MODULES = [
/* ================================================================ 1 */
{
  group:"Foundations",
  title:"Metrics, logs & tables",
  tag:"metrics vs logs · workspace-based Application Insights · table names",
  intro:`Everything in this theme reads one of two kinds of Azure Monitor data. <b>Metrics</b> are lightweight numeric time series (CPU %, request count) that arrive in near real time and are charted in <b>metrics explorer</b>. <b>Logs</b> are rich records with many properties, stored in a <b>Log Analytics workspace</b> and queried with <b>KQL</b>. Application Insights (the APM feature of Azure Monitor) stores its telemetry in a workspace too.`,
  sections:[
    {h:"Metrics or logs?", after:`<div class="tablewrap"><table class="ref">
<tr><th></th><th>Metrics</th><th>Logs</th></tr>
<tr><td>Shape</td><td>Numeric value + timestamp + a few dimensions</td><td>Records with many typed columns (text, dynamic JSON, IDs)</td></tr>
<tr><td>Latency</td><td>Near real time, ideal for fast alerts</td><td>Minutes from ingestion to query</td></tr>
<tr><td>Tool</td><td>Metrics explorer, metric alerts</td><td>Log Analytics (Logs blade), KQL, log search alerts</td></tr>
<tr><td>Examples</td><td>Percentage CPU of a VM, Http 5xx count of a web app</td><td>Every request with its URL, duration, user and operation ID</td></tr>
<tr><td>Retention</td><td>Platform metrics are kept 93 days</td><td>Configured per workspace / table</td></tr>
</table></div>`},
    {h:"Two names for the same Application Insights data",
     p:`Classic Application Insights resources were retired in February 2024; every resource is now <b>workspace-based</b>. Telemetry lands in workspace tables with <code>App*</code> names. The <b>Logs</b> blade of the Application Insights resource still accepts the original (classic) table and column names, which is what most docs and exam questions use. In the workspace itself you must use the new names.`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Classic (App Insights Logs blade)</th><th>Workspace table</th><th>Column differences</th></tr>
<tr><td><code>requests</code></td><td><code>AppRequests</code></td><td><code>timestamp</code> → <code>TimeGenerated</code>, <code>duration</code> → <code>DurationMs</code>, <code>name</code> → <code>Name</code>, <code>success</code> → <code>Success</code>, <code>resultCode</code> → <code>ResultCode</code></td></tr>
<tr><td><code>dependencies</code></td><td><code>AppDependencies</code></td><td><code>type</code> → <code>DependencyType</code>, <code>target</code> → <code>Target</code></td></tr>
<tr><td><code>exceptions</code></td><td><code>AppExceptions</code></td><td><code>type</code> → <code>ExceptionType</code>, <code>outerMessage</code> → <code>OuterMessage</code></td></tr>
<tr><td><code>traces</code></td><td><code>AppTraces</code></td><td><code>message</code> → <code>Message</code>, <code>severityLevel</code> → <code>SeverityLevel</code></td></tr>
<tr><td><code>pageViews</code> / <code>customEvents</code></td><td><code>AppPageViews</code> / <code>AppEvents</code></td><td><code>user_Id</code> → <code>UserId</code>, <code>session_Id</code> → <code>SessionId</code></td></tr>
<tr><td colspan="3">All tables: <code>operation_Id</code> → <code>OperationId</code>, <code>operation_ParentId</code> → <code>ParentId</code>, <code>cloud_RoleName</code> → <code>AppRoleName</code>, <code>customDimensions</code> → <code>Properties</code>, <code>itemCount</code> → <code>ItemCount</code></td></tr>
</table></div>`},
    {h:"Infrastructure tables in Log Analytics", after:`<div class="tablewrap"><table class="ref">
<tr><th>Table</th><th>Filled by</th><th>Typical question</th></tr>
<tr><td><code>Perf</code></td><td>Performance counters collected by the Azure Monitor agent (data collection rule)</td><td>CPU, memory, disk, network counters per computer</td></tr>
<tr><td><code>InsightsMetrics</code></td><td>VM insights</td><td>Processor / memory / disk / network metrics shown in the VM insights charts</td></tr>
<tr><td><code>Heartbeat</code></td><td>Every connected agent, once a minute</td><td>Which machines are still reporting? Agent version, OS type</td></tr>
<tr><td><code>AzureActivity</code></td><td>The subscription activity log (via a diagnostic setting)</td><td>Who created, changed or deleted which resource, and when?</td></tr>
<tr><td><code>ContainerLogV2</code>, <code>KubePodInventory</code></td><td>Container insights (AKS)</td><td>Container stdout/stderr, pod status and restarts</td></tr>
</table></div>`}
  ],
  tip:`Fast numeric signal or alert on a threshold → <b>metrics</b>. Need to search, correlate or slice by any property → <b>logs + KQL</b>. If a query mixes <code>requests</code> with <code>TimeGenerated</code>, or <code>AppRequests</code> with <code>timestamp</code>, it's wrong.`,
  exercises:[
    {id:"mt1", type:"match", title:"Metric or log?",
     q:`For each need, pick the data type you would use.`,
     rows:[
       ["Alert within about a minute when a VM's Percentage CPU stays above 90%", "Metrics"],
       ["List every request that threw a <code>SqlException</code>, with its URL and user ID", "Logs"],
       ["Chart Http 5xx for an App Service app on a dashboard, no code changes", "Metrics"],
       ["Correlate one slow request with the database calls it made", "Logs"],
       ["Find out who deleted a storage account last Tuesday", "Logs"]
     ],
     choices:["Metrics","Logs"],
     hint:`Metrics are numbers over time; logs are records you can search and join.`,
     why:`Threshold alerts and simple charts of platform values are what metrics are for: they're near real time and need no agent. Anything that needs individual records (a request's URL, a correlated dependency call, the caller of a delete in <code>AzureActivity</code>) is a log query.`},
    {id:"mt2", type:"match", title:"Classic name → workspace table",
     q:`Your team moved queries from the Application Insights Logs blade to the Log Analytics workspace. Match each classic table to its workspace table.`,
     rows:[["<code>requests</code>","AppRequests"],["<code>dependencies</code>","AppDependencies"],["<code>exceptions</code>","AppExceptions"],["<code>traces</code>","AppTraces"],["<code>customEvents</code>","AppEvents"],["<code>pageViews</code>","AppPageViews"]],
     choices:["AppRequests","AppDependencies","AppExceptions","AppTraces","AppEvents","AppPageViews"],
     hint:`Mostly "App" + the singular/plural name with a capital letter. One is shortened.`,
     why:`The workspace tables keep the concept but use PascalCase and an <code>App</code> prefix. The odd one out is <code>customEvents</code> → <code>AppEvents</code>.`},
    {id:"mt3", type:"fill", title:"Column names in the workspace", mono:true,
     q:`Rewrite the classic columns for <code>AppRequests</code>.`,
     tpl:`timestamp          →  [[0]]
duration           →  [[1]]
operation_Id       →  [[2]]
operation_ParentId →  [[3]]
cloud_RoleName     →  [[4]]`,
     blanks:[["TimeGenerated"],["DurationMs"],["OperationId"],["ParentId"],["AppRoleName"]],
     hint:`Every workspace table uses the same time column. Duration states its unit. The role name moves to an App… column.`,
     why:`<code>TimeGenerated</code> is the time column of every Log Analytics table. <code>DurationMs</code>, <code>OperationId</code>, <code>ParentId</code> and <code>AppRoleName</code> are the workspace equivalents of the classic columns.`},
    {id:"mt4", type:"lines", title:"Mixed-up schema",
     q:`This query runs in the <b>Log Analytics workspace</b>. Click the lines that will fail because they use classic names.`,
     code:["AppRequests","| where TimeGenerated > ago(1h)","| where success == false","| summarize Failures = count() by Name, cloud_RoleName","| order by Failures desc"],
     answer:[2,3],
     hint:`Two columns are spelled the classic way.`,
     why:`<code>AppRequests</code> has <code>Success</code> (KQL column names are case-sensitive) and <code>AppRoleName</code>, not <code>success</code> and <code>cloud_RoleName</code>. <code>TimeGenerated</code> and <code>Name</code> are already correct.`},
    {id:"mt5", type:"mc", title:"Which table answers it?",
     q:`An operator asks: "Which of our 40 VMs have stopped sending data to the workspace in the last 15 minutes?" Which table do you query?`,
     options:["Heartbeat","Perf","AzureActivity","requests"], answer:0,
     hint:`One table gets a row from each connected agent every minute.`,
     why:`Every connected agent writes a <code>Heartbeat</code> record once a minute, so the latest <code>TimeGenerated</code> per <code>Computer</code> tells you who has gone quiet. <code>Perf</code> depends on which counters you collect, <code>AzureActivity</code> is control-plane operations, and <code>requests</code> is application telemetry.`}
  ]
},
/* ================================================================ 2 */
{
  group:"Read the signals",
  title:"Infrastructure indicators",
  tag:"CPU · memory · disk · network · VMs, App Service, containers · metrics explorer",
  intro:`Before you blame the code, check the platform. Four resources tell most of the story: <b>CPU</b>, <b>memory</b>, <b>disk</b> and <b>network</b>. Azure collects host-level metrics for VMs, App Service and AKS automatically; deeper in-guest counters need the <b>Azure Monitor agent</b> (VM insights or a data collection rule).`,
  sections:[
    {h:"What to look at, per resource", after:`<div class="tablewrap"><table class="ref">
<tr><th>Resource</th><th>Key metrics</th><th>Notes</th></tr>
<tr><td><b>Virtual machine</b> (host metrics, no agent)</td><td>Percentage CPU · Available Memory Bytes · Disk Read/Write Bytes and Operations/Sec · OS/Data Disk IOPS Consumed Percentage · Network In Total / Network Out Total · CPU Credits Remaining (B-series)</td><td>Guest-only data such as <b>free space per logical disk</b>, per-process usage or page-file counters requires the Azure Monitor agent (<code>Perf</code> / <code>InsightsMetrics</code>).</td></tr>
<tr><td><b>App Service plan</b></td><td>CPU Percentage · Memory Percentage · Disk Queue Length · Http Queue Length · Data In / Data Out</td><td>Plan metrics are shared by all apps on the plan; split by <b>Instance</b> to spot one bad worker.</td></tr>
<tr><td><b>App Service app</b></td><td>Requests · Http 5xx / Http 4xx · Response Time · Memory working set · CPU Time · Health check status</td><td>App-level view of load and errors.</td></tr>
<tr><td><b>AKS / containers</b> (Container insights)</td><td>Node CPU and memory vs allocatable · container <b>working set</b> memory · pod restarts and status · CPU throttling</td><td>A container over its <b>memory limit</b> is <b>OOMKilled</b> and restarted; one over its <b>CPU limit</b> is <b>throttled</b>, not killed.</td></tr>
</table></div>`},
    {h:"Reading the patterns", after:`<div class="tablewrap"><table class="ref">
<tr><th>Pattern</th><th>Likely meaning</th></tr>
<tr><td>CPU high on every instance + Http Queue Length growing</td><td>Not enough compute: scale out (more instances) or up</td></tr>
<tr><td>Memory climbs steadily for days and drops after each restart</td><td>Memory leak in the application</td></tr>
<tr><td>Disk IOPS (or bandwidth) Consumed Percentage at 100% while CPU is low</td><td>Disk is throttled at its performance cap: faster disk tier / bigger disk, or a VM size with higher limits</td></tr>
<tr><td>B-series VM: CPU Credits Remaining hits 0, then CPU is capped</td><td>Burstable VM out of credits: move to a non-burstable size</td></tr>
<tr><td>One instance much hotter than the others</td><td>Uneven load (sticky sessions / ARR affinity) or a bad instance</td></tr>
<tr><td>Network Out spikes with no matching request increase</td><td>Large responses, backups, or unexpected data transfer to investigate</td></tr>
</table></div>`},
    {h:"Metrics explorer in five moves", p:`<b>1 Scope</b> (one or more resources of the same type and region) → <b>2 Metric</b> (+ namespace) → <b>3 Aggregation</b>: <i>Avg</i>, <i>Min</i>, <i>Max</i>, <i>Sum</i>, <i>Count</i> → <b>4 Filter / Apply splitting</b> on a dimension (e.g. Instance, ResultCode) → <b>5 Share</b>: pin to a dashboard, add to a workbook, or create an alert rule from the chart. Averages over a large time grain hide spikes: use <b>Max</b> to see peaks, <b>Sum</b> for counts of events (requests, errors).`},
    {h:"The same signal in KQL (Perf)", lang:"kql", code:`Perf
| where TimeGenerated > ago(1h)
| where ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total"
| summarize avg(CounterValue) by bin(TimeGenerated, 5m), Computer
| render timechart`}
  ],
  tip:`Exam scenarios pair a symptom with a metric: "slow but CPU low" → look at <b>disk</b> (IOPS consumed, queue length) or a <b>dependency</b>. "Free disk space" or "memory used by a process" → needs the <b>Azure Monitor agent</b>. "See each instance separately" → <b>apply splitting</b> in metrics explorer.`,
  exercises:[
    {id:"in1", type:"match", title:"Symptom → diagnosis",
     q:`Match each observation to the most likely explanation.`,
     rows:[
       ["App Service plan: CPU Percentage 95% on all instances, Http Queue Length rising", "Not enough compute: scale out the plan"],
       ["Memory Percentage creeps up for three days, drops after every restart", "Memory leak in the application"],
       ["VM: Data Disk IOPS Consumed Percentage pinned at 100%, CPU at 20%", "Disk throttled at its performance cap"],
       ["B-series VM: CPU Credits Remaining reaches 0, CPU then flat at a low level", "Burstable VM ran out of CPU credits"],
       ["AKS pod restarts repeatedly with reason OOMKilled", "Container exceeds its memory limit"]
     ],
     choices:["Not enough compute: scale out the plan","Memory leak in the application","Disk throttled at its performance cap","Burstable VM ran out of CPU credits","Container exceeds its memory limit"],
     hint:`Look at which resource is saturated and whether it recovers on restart.`,
     why:`Saturated CPU plus a growing HTTP queue means the instances can't keep up. A memory curve that resets on restart is the classic leak signature. A disk at 100% of its IOPS cap throttles I/O regardless of CPU. B-series VMs run at a baseline once credits are gone. OOMKilled means the container's working set exceeded its memory limit.`},
    {id:"in2", type:"mc", title:"Which one needs an agent?",
     q:`You want to chart these for a Windows VM. Which one is <b>not</b> available as a host (platform) metric and needs the Azure Monitor agent?`,
     options:["Percentage CPU","Network In Total","Free space percentage of the D: logical disk","Disk Write Operations/Sec"], answer:2,
     hint:`The host sees the virtual disk, not the file system inside the guest.`,
     why:`The hypervisor can measure CPU, network and disk I/O from outside the VM, but it can't see the file system, so free space per logical disk comes from guest counters (<code>Perf</code> "LogicalDisk / % Free Space" or VM insights) collected by the Azure Monitor agent.`},
    {id:"in3", type:"mc", title:"Choose the aggregation",
     q:`Users complain about short freezes. On a 24-hour metrics explorer chart of a VM's Percentage CPU with the default aggregation, everything looks fine at around 40%. Which change most likely reveals the problem?`,
     options:["Switch the aggregation to Max","Switch the aggregation to Count","Switch the aggregation to Sum","Change the chart type to an area chart"], answer:0,
     hint:`Averaging many samples smooths away short peaks.`,
     why:`Avg over a long time grain flattens brief spikes. <b>Max</b> shows the highest sample in each interval, so a 30-second spike to 100% becomes visible. Count counts samples and Sum of a percentage is meaningless.`},
    {id:"in4", type:"mc", title:"One bad instance?",
     q:`An App Service plan runs 4 instances. CPU Percentage averages 60%, but you suspect one instance is at 100%. What do you do in metrics explorer?`,
     options:["Apply splitting on the Instance dimension","Add a filter Instance = all","Change the time range to the last 30 days","Create a second chart with Memory Percentage"], answer:0,
     hint:`You want one line per value of a dimension.`,
     why:`<b>Splitting</b> draws one series per dimension value, so each instance gets its own line. A filter narrows to selected values, and a longer time range or another metric doesn't separate the instances.`},
    {id:"in5", type:"kql", title:"CPU per computer as a time chart",
     q:`Write a query for the last <b>hour</b> that shows the average total CPU (<code>ObjectName</code> "Processor", <code>CounterName</code> "% Processor Time", <code>InstanceName</code> "_Total") per <code>Computer</code> in <b>5-minute</b> bins, rendered as a time chart.${sch("Perf", S_PERF)}`,
     starter:`Perf
`,
     checks:[
       {l:"Starts from the Perf table", t:q => q.table === "perf"},
       {l:"Keeps only the last hour (TimeGenerated > ago(1h))", t:q => q.where(...TIME("TimeGenerated","1h"))},
       {l:"Filters ObjectName, CounterName and InstanceName", t:q => q.where('ObjectName == "Processor"') && q.where('CounterName == "% Processor Time"') && q.where('InstanceName == "_Total"')},
       {l:"summarize avg(CounterValue) by bin(TimeGenerated, 5m), Computer", t:q => q.sum([["avg(CounterValue)"]], [["bin(TimeGenerated, 5m)","floor(TimeGenerated, 5m)"], "Computer"])},
       {l:"Renders a timechart after the summarize", t:q => q.render("timechart") && q.before("summarize","render")}
     ],
     cols:["Perf","TimeGenerated","ObjectName","CounterName","InstanceName","CounterValue","Computer"],
     solution:`Perf
| where TimeGenerated > ago(1h)
| where ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total"
| summarize avg(CounterValue) by bin(TimeGenerated, 5m), Computer
| render timechart`,
     accept:[`Perf | WHERE TimeGenerated >= ago(60m) | where ObjectName=='Processor' | where CounterName == "% Processor Time" and InstanceName == "_Total" | summarize AvgCpu = avg(CounterValue) by Computer, bin(TimeGenerated, 300s) | render timechart`],
     reject:[`Perf | where TimeGenerated > ago(1h) | where ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total" | summarize avg(CounterValue) by Computer | render timechart`,
             `Perf | where timegenerated > ago(1h) | where ObjectName == "Processor" and CounterName == "% Processor Time" and InstanceName == "_Total" | summarize avg(CounterValue) by bin(timegenerated, 5m), Computer | render timechart`],
     hint:`Filter first (time, then counter), then <code>summarize avg(...) by bin(TimeGenerated, 5m), Computer</code>, then <code>render timechart</code>.`,
     why:`Filtering before aggregating keeps the query cheap. <code>bin()</code> groups timestamps into 5-minute buckets and the extra <code>Computer</code> key gives one series per machine, which <code>render timechart</code> draws as separate lines.`},
    {id:"in6", type:"kql", title:"Disks running out of space",
     q:`Using the Windows counter <code>ObjectName</code> "LogicalDisk", <code>CounterName</code> "% Free Space", find every <code>Computer</code> and <code>InstanceName</code> (drive) whose <b>lowest</b> free-space value in the last <b>hour</b> was below <b>10</b>. Exclude the "_Total" instance.${sch("Perf", S_PERF)}`,
     starter:`Perf
`,
     checks:[
       {l:"Filters the last hour", t:q => q.where(...TIME("TimeGenerated","1h"))},
       {l:"Filters the LogicalDisk / % Free Space counter", t:q => q.where('ObjectName == "LogicalDisk"') && q.where('CounterName == "% Free Space"')},
       {l:"Excludes InstanceName \"_Total\"", t:q => q.where('InstanceName != "_Total"','InstanceName !~ "_Total"','not(InstanceName == "_Total")')},
       {l:"summarize min(CounterValue) by Computer, InstanceName", t:q => q.sum([["min(CounterValue)"]], ["Computer","InstanceName"])},
       {l:"Then keeps only values below 10 (where … < 10 after the summarize)", t:q => { const i = q.idx("summarize"); return i >= 0 && q.main.some((s, k) => k > i && s.op === "where" && s.preds.some(p => /^[\w]+<10$/.test(p))); }}
     ],
     cols:["Perf","TimeGenerated","ObjectName","CounterName","InstanceName","CounterValue","Computer"],
     solution:`Perf
| where TimeGenerated > ago(1h)
| where ObjectName == "LogicalDisk" and CounterName == "% Free Space"
| where InstanceName != "_Total"
| summarize MinFreePct = min(CounterValue) by Computer, InstanceName
| where MinFreePct < 10`,
     accept:[`Perf | where TimeGenerated > ago(1h) and ObjectName == "LogicalDisk" and CounterName == "% Free Space" and InstanceName != "_Total" | summarize min(CounterValue) by InstanceName, Computer | where min_CounterValue < 10 | order by min_CounterValue asc`],
     reject:[`Perf | where TimeGenerated > ago(1h) | where ObjectName == "LogicalDisk" and CounterName == "% Free Space" | where CounterValue < 10 | summarize min(CounterValue) by Computer, InstanceName`],
     hint:`Aggregate first, then filter on the aggregated column: the default name of <code>min(CounterValue)</code> is <code>min_CounterValue</code>, or give it your own alias.`,
     why:`A <code>where</code> after <code>summarize</code> filters on the aggregate (like SQL's HAVING). Excluding <code>_Total</code> avoids the averaged pseudo-instance hiding a single full drive. This is guest data, so it only exists when the Azure Monitor agent collects the LogicalDisk counters.`}
  ]
},

{
  group:"Read the signals",
  title:"Application performance",
  tag:"Performance & Failures views · Application Map · Live Metrics · smart detection",
  intro:`Application Insights turns request, dependency and exception telemetry into ready-made investigation views. Know <b>which view answers which question</b>: that's what the exam tests.`,
  sections:[
    {h:"The views", after:`<div class="tablewrap"><table class="ref">
<tr><th>View</th><th>Answers</th></tr>
<tr><td><b>Application Map</b></td><td>Which components (one node per <b>cloud role name</b>) call which dependencies, with call counts, average duration and failure rate on each node and arrow. Find the component that drags everything down.</td></tr>
<tr><td><b>Performance</b></td><td>Operations ranked by duration and count, with a <b>duration distribution</b>. Drill into slow <b>samples</b>, see their dependencies, and open Profiler traces if Profiler is enabled.</td></tr>
<tr><td><b>Failures</b></td><td>Failed operations, failing <b>dependencies</b> and <b>exceptions</b>, top response codes and exception types. Drill into a sample.</td></tr>
<tr><td><b>Transaction search</b></td><td>Find individual telemetry items by type, time, property or text.</td></tr>
<tr><td><b>End-to-end transaction details</b></td><td>One operation across all components as a timeline (Gantt) with related traces and exceptions (next module).</td></tr>
<tr><td><b>Live Metrics</b></td><td>A real-time stream (about 1 second latency) of request rate, failures, dependency calls, CPU/memory and sample failures. Nothing is stored: ideal for watching a deployment as it happens.</td></tr>
<tr><td><b>Smart detection</b></td><td>Machine-learning based warnings without manual thresholds: <b>Failure Anomalies</b> (unusual rise in failed request rate) and <b>performance anomalies</b> such as degraded server response time or dependency duration. A Failure Anomalies alert rule is created automatically with a new Application Insights resource.</td></tr>
</table></div>`},
    {h:"Averages lie, percentiles don't", p:`An average of 300 ms can hide 5% of users waiting 8 seconds. The Performance view's duration distribution and percentiles (P50, P95, P99) show the tail. In KQL that's <code>percentiles(duration, 50, 95, 99)</code>.`},
    {h:"Sampling", p:`With (adaptive) sampling enabled, only a share of telemetry is kept, and each retained item carries <code>itemCount</code>, the number of original items it represents. The portal views compensate automatically; in your own KQL use <code>sum(itemCount)</code> rather than <code>count()</code> for accurate totals.`}
  ],
  tip:`Keywords: "<b>which component / dependency</b> is the bottleneck" → Application Map. "<b>real time</b> during a release" → Live Metrics. "<b>slowest operations</b>" → Performance. "<b>top exceptions / response codes</b>" → Failures. "<b>notify automatically</b> about unusual failure rates without setting thresholds" → smart detection (Failure Anomalies).`,
  exercises:[
    {id:"ap1", type:"match", title:"Pick the view",
     q:`Which Application Insights feature fits each need?`,
     rows:[
       ["Watch request rate and failures second by second while a deployment rolls out", "Live Metrics"],
       ["See which downstream component makes the whole app slow, at a glance", "Application Map"],
       ["Rank operations by duration and drill into the slowest samples", "Performance"],
       ["Find the top exception types and response codes behind failed requests", "Failures"],
       ["Be warned about an unusual rise in failed requests without setting a threshold", "Smart detection"],
       ["Find the single request a customer reported, by a custom property", "Transaction search"]
     ],
     choices:["Live Metrics","Application Map","Performance","Failures","Smart detection","Transaction search"],
     hint:`Real time, topology, latency, errors, automatic anomaly detection, item lookup.`,
     why:`Each view is built for one investigation step: Live Metrics for now, Application Map for topology, Performance for latency, Failures for errors, smart detection for automatic anomaly warnings, and Transaction search for finding specific items.`},
    {id:"ap2", type:"mc", title:"Two services, one node",
     q:`Your web front end and your orders API both send telemetry to the same Application Insights resource, but Application Map shows them as a <b>single node</b>. What's the most likely fix?`,
     options:[
       "Give each service its own cloud role name (with OpenTelemetry: the service.name resource attribute)",
       "Create a separate Log Analytics workspace for each service",
       "Enable Live Metrics on both services",
       "Increase the sampling percentage"],
     answer:0,
     hint:`What does Application Map use to decide which node a telemetry item belongs to?`,
     why:`Application Map groups telemetry by <b>cloud role name</b>. If both apps report the same (or default) role name they collapse into one node. With the Azure Monitor OpenTelemetry Distro the role name comes from the <code>service.name</code> (and <code>service.namespace</code>) resource attributes.`},
    {id:"ap3", type:"multi", title:"Live Metrics facts",
     q:`Which statements about Live Metrics are true? <i>Select all that apply.</i>`,
     options:[
       "It shows data with roughly one second of latency",
       "The streamed data is not stored; close the view and it's gone",
       "You can filter the stream and see sample failed requests and exceptions",
       "It replaces alert rules, because someone is always watching",
       "It lets you query the last 90 days of requests"],
     answer:[0,1,2],
     hint:`Live = now, not history.`,
     why:`Live Metrics is a real-time stream for watching a release or incident as it happens, with custom filters and sample failures. It isn't persisted, so it's no substitute for stored telemetry (Logs) or for alerts.`},
    {id:"ap4", type:"mc", title:"Fine on average, slow for some",
     q:`In the Performance view, <code>GET /cart</code> has an average duration of 280 ms, yet support gets complaints that the cart "sometimes takes ages". What's the best next step?`,
     options:[
       "Look at the duration distribution / 95th and 99th percentiles and drill into the slow samples",
       "Ignore it: an average of 280 ms is within target",
       "Restart the web app and check the average again",
       "Switch on Live Metrics and wait for the next complaint"],
     answer:0,
     hint:`The average hides the tail.`,
     why:`A small fraction of very slow requests barely moves the average. The distribution and high percentiles show the tail, and drilling into the slow samples opens their end-to-end details, where you can see which dependency or step took the time.`},
    {id:"ap5", type:"order", title:"Investigate a spike in failures",
     q:`A Failure Anomalies alert fires for your web app. Put a sensible investigation in order.`,
     items:[
       "Open the Failures view for the alert's time window",
       "Select the failing operation and look at its top response codes and exception types",
       "Drill into a sample failed request",
       "Read the end-to-end transaction details to see which dependency failed",
       "Query the logs with KQL to measure how many users and operations were affected"],
     hint:`Overview → narrow → one example → root cause → impact.`,
     why:`Start broad in Failures, narrow to the operation and its dominant exception or code, inspect one sample's end-to-end transaction for the root cause, then quantify impact with a KQL query.`},
    {id:"ap6", type:"mc", title:"Count with sampling",
     q:`Adaptive sampling is enabled. A dashboard query uses <code>requests | summarize count() by bin(timestamp, 1h)</code> and shows far fewer requests than the load balancer. How do you fix the query?`,
     options:["Use summarize sum(itemCount) instead of count()","Use summarize dcount(id)","Add | take 100000","Switch to the AppRequests table, which isn't sampled"],
     answer:0,
     hint:`Each retained item knows how many original items it stands for.`,
     why:`Every sampled-in item carries <code>itemCount</code> (e.g. 5 if 1 in 5 was kept). <code>sum(itemCount)</code> estimates the real total. The workspace table holds the same sampled data, and <code>take</code> or <code>dcount</code> don't undo sampling.`}
  ]
},

{
  group:"Read the signals",
  title:"Usage analysis",
  tag:"users · sessions · events · funnels · cohorts · retention · user flows",
  intro:`Usage analytics answers product questions: who uses the app, what they do and whether they come back. It relies on <b>client-side telemetry</b>: the Application Insights JavaScript SDK (page views, user and session IDs) plus <b>custom events</b> you track for important actions.`,
  sections:[
    {h:"The usage tools", after:`<div class="tablewrap"><table class="ref">
<tr><th>Tool</th><th>Answers</th></tr>
<tr><td><b>Users / Sessions / Events</b></td><td>How many users, sessions or events over time, split by properties such as country, browser or a custom dimension.</td></tr>
<tr><td><b>Funnels</b></td><td>Of the users who did step 1, how many did step 2, 3… (conversion and drop-off in a sequence such as cart → checkout → pay).</td></tr>
<tr><td><b>User Flows</b></td><td>The paths users take to and from a page or event, and where they leave the site.</td></tr>
<tr><td><b>Retention</b></td><td>How many users come back after their first visit, over the following days or weeks.</td></tr>
<tr><td><b>Cohorts</b></td><td>A saved set of users, sessions, events or operations with something in common, reused as a filter in the other tools.</td></tr>
</table></div>`},
    {h:"Usage in KQL", lang:"kql", code:`// daily active users over the last 30 days
pageViews
| where timestamp > ago(30d)
| summarize Users = dcount(user_Id) by bin(timestamp, 1d)
| render timechart`},
    {h:"Identifying users", p:`The JavaScript SDK sets an anonymous user ID in a cookie (<code>user_Id</code>) and a session ID (<code>session_Id</code>). If you call <code>setAuthenticatedUserContext</code>, the signed-in ID is sent too (<code>user_AuthenticatedId</code>), so usage can be counted per real account across devices.`}
  ],
  tip:`"How many complete the sequence / where do they drop out" → <b>Funnels</b>. "Do they come back" → <b>Retention</b>. "What do they do next / where do they leave" → <b>User Flows</b>. "Reuse a group of users" → <b>Cohorts</b>. Empty usage reports usually mean the <b>browser SDK</b> isn't installed.`,
  exercises:[
    {id:"us1", type:"match", title:"Which usage tool?",
     q:`Match each product question to the tool that answers it.`,
     rows:[
       ["What percentage of users who add to cart go on to complete payment?", "Funnels"],
       ["Of users who first visited in week 1, how many returned in weeks 2–4?", "Retention"],
       ["After the pricing page, where do users go next, and where do they leave?", "User Flows"],
       ["Define 'users who used the export feature' once and filter other reports by it", "Cohorts"],
       ["How many distinct users per day, split by country?", "Users"]
     ],
     choices:["Funnels","Retention","User Flows","Cohorts","Users"],
     hint:`Sequence, return visits, paths, reusable group, plain counts.`,
     why:`Funnels measure conversion through ordered steps, Retention measures return visits, User Flows show navigation paths, Cohorts save a group for reuse, and Users counts distinct users with splitting.`},
    {id:"us2", type:"mc", title:"No usage data",
     q:`A team added the Application Insights server-side SDK to their ASP.NET Core app. Requests and dependencies appear, but the Users, Sessions and Funnels tools are empty. What's missing?`,
     options:[
       "The Application Insights JavaScript SDK in the web pages (and custom events for key actions)",
       "A Log Analytics workspace",
       "Enabling Live Metrics",
       "A Failure Anomalies alert rule"],
     answer:0,
     hint:`Users and sessions are a browser concept.`,
     why:`Page views, anonymous user IDs and session IDs come from the browser. Without the JavaScript SDK (or custom events with user context) the usage tools have nothing to work with.`},
    {id:"us3", type:"kql", title:"Daily active users",
     q:`Count the <b>distinct users</b> (<code>user_Id</code>) per <b>day</b> for the last <b>7 days</b> from page views and render a time chart.${sch("pageViews", ["timestamp:datetime","name:string","url:string","user_Id:string","session_Id:string","client_CountryOrRegion:string"])}`,
     starter:`pageViews
`,
     checks:[
       {l:"Uses the pageViews table", t:q => q.table === "pageviews"},
       {l:"Last 7 days", t:q => q.where(...TIME("timestamp","7d"))},
       {l:"summarize dcount(user_Id) by bin(timestamp, 1d)", t:q => q.sum([["dcount(user_Id)"]], [["bin(timestamp, 1d)","floor(timestamp, 1d)","startofday(timestamp)"]])},
       {l:"render timechart", t:q => q.render("timechart")}
     ],
     cols:["pageViews","timestamp","user_Id"],
     solution:`pageViews
| where timestamp > ago(7d)
| summarize Users = dcount(user_Id) by bin(timestamp, 1d)
| render timechart`,
     accept:[`pageViews | where timestamp >= ago(168h) | summarize dcount(user_Id) by bin(timestamp, 24h) | render timechart with (title="DAU")`],
     reject:[`pageViews | where timestamp > ago(7d) | summarize count() by bin(timestamp, 1d) | render timechart`],
     hint:`<code>dcount()</code> counts distinct values; <code>count()</code> would count page views.`,
     why:`<code>dcount(user_Id)</code> gives distinct users per bucket (an estimate, accurate enough for usage reporting), and binning by one day turns it into daily active users.`},
    {id:"us4", type:"kql", title:"Most used features",
     q:`Each feature use is tracked as a custom event. Show the <b>5</b> event <code>name</code>s with the most occurrences in the last <b>30 days</b>, highest first.${sch("customEvents", ["timestamp:datetime","name:string","user_Id:string","session_Id:string","customDimensions:dynamic"])}`,
     starter:`customEvents
`,
     checks:[
       {l:"Last 30 days", t:q => q.where(...TIME("timestamp","30d"))},
       {l:"summarize count() by name", t:q => q.sum([["count()"]], ["name"])},
       {l:"Keeps the top 5 by that count, highest first", t:q => { const s = q.sumStage(); if (!s) return false; const names = s.aliases.length ? s.aliases : ["count_"]; return q.limited(5) && names.some(n => q.sortedDesc(n)); }}
     ],
     cols:["customEvents","timestamp","name"],
     solution:`customEvents
| where timestamp > ago(30d)
| summarize Uses = count() by name
| top 5 by Uses desc`,
     accept:[`customEvents | where timestamp > ago(30d) | summarize count() by name | order by count_ desc | take 5`,
             `customEvents | where timestamp > ago(30d) | summarize Uses=count() by name | sort by Uses | limit 5`],
     reject:[`customEvents | where timestamp > ago(30d) | summarize count() by name | take 5`,
             `customEvents | where timestamp > ago(30d) | summarize Uses = count() by name | top 5 by Uses asc`],
     hint:`<code>top 5 by X</code> sorts descending by default. Without an alias the count column is called <code>count_</code>.`,
     why:`<code>take</code> alone returns arbitrary rows; you must sort first (<code>order by … desc | take 5</code>) or use <code>top 5 by …</code>, which sorts and limits in one step.`}
  ]
},

{
  group:"Read the signals",
  title:"Distributed tracing",
  tag:"operation ID · parent ID · W3C Trace Context · end-to-end transactions · OpenTelemetry",
  intro:`One click in the browser can touch a front end, two APIs, a queue and a database. <b>Distributed tracing</b> stitches all that telemetry into one <b>operation</b> so you can follow it end to end, even across Application Insights resources.`,
  sections:[
    {h:"How the pieces are linked", lang:"text", code:`traceparent: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
              │  │                                │                └ trace-flags (01 = sampled)
              │  │                                └ parent-id: span ID of the caller (16 hex)
              │  └ trace-id: shared by the whole operation (32 hex)
              └ version`,
     p:`Services propagate the <b>W3C Trace Context</b> <code>traceparent</code> HTTP header. Application Insights maps it to its data model:`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>Concept</th><th>Classic column</th><th>Workspace column</th></tr>
<tr><td>Trace ID: same for every item in the operation</td><td><code>operation_Id</code></td><td><code>OperationId</code></td></tr>
<tr><td>This item's own span ID</td><td><code>id</code></td><td><code>Id</code></td></tr>
<tr><td>The span that caused this item</td><td><code>operation_ParentId</code></td><td><code>ParentId</code></td></tr>
</table></div>
<p>So when the front end calls the orders API, the front end records a <b>dependency</b> with <code>id = X</code>, and the orders API records a <b>request</b> whose <code>operation_ParentId = X</code>. Both share the same <code>operation_Id</code>.</p>`},
    {h:"OpenTelemetry", p:`Microsoft's recommended instrumentation is the <b>Azure Monitor OpenTelemetry Distro</b> (or the Azure Monitor exporter), configured with a <b>connection string</b> (instrumentation-key-only ingestion is no longer supported). OpenTelemetry spans map to Application Insights tables by span kind:`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>OpenTelemetry signal</th><th>Application Insights table</th></tr>
<tr><td>Span kind <b>Server</b> or <b>Consumer</b></td><td><code>requests</code></td></tr>
<tr><td>Span kind <b>Client</b>, <b>Producer</b> or <b>Internal</b></td><td><code>dependencies</code></td></tr>
<tr><td>Recorded exceptions</td><td><code>exceptions</code></td></tr>
<tr><td>Log records</td><td><code>traces</code></td></tr>
<tr><td>Resource attribute <code>service.name</code></td><td>cloud role name (the node in Application Map)</td></tr>
</table></div>`},
    {h:"Seeing it", p:`<b>End-to-end transaction details</b> (open any sample from Performance, Failures or Transaction search) shows all requests and dependencies of one operation as a timeline across components, with the traces and exceptions that belong to it. Application Map is the aggregated view of the same correlation data. In KQL, filter every table on the same <code>operation_Id</code>.`}
  ],
  tip:`"Correlate telemetry across microservices" → shared <b>operation ID</b> via W3C <b>traceparent</b> propagation. "Two calls show up as separate transactions" → the context isn't being <b>propagated</b> (custom HTTP client, message queue without propagation, or an uninstrumented hop).`,
  exercises:[
    {id:"dt1", type:"fill", title:"Read a traceparent header", mono:true,
     q:`The orders API receives this header: <code>traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</code>. Fill in the classic column names.`,
     tpl:`4bf92f3577b34da6a3ce929d0e0e4736  →  stored in [[0]] on every item of the operation
00f067aa0ba902b7                  →  stored in [[1]] of the orders API's request`,
     blanks:[["operation_Id","OperationId"],["operation_ParentId","ParentId"]],
     hint:`The 32-hex value is the trace ID, the 16-hex value is the caller's span ID.`,
     why:`The trace-id becomes <code>operation_Id</code> for everything in the operation, and the parent-id (the caller's span, i.e. its dependency <code>id</code>) becomes the new request's <code>operation_ParentId</code>.`},
    {id:"dt2", type:"match", title:"Span kind → table",
     q:`Your service is instrumented with the Azure Monitor OpenTelemetry Distro. Where does each signal land?`,
     rows:[["A <b>Server</b> span for an incoming HTTP call","requests"],["A <b>Client</b> span for an outgoing SQL call","dependencies"],["A <b>Consumer</b> span processing a Service Bus message","requests"],["A <b>Producer</b> span sending a message","dependencies"],["A log record written with ILogger / logging API","traces"],["An exception recorded on a span","exceptions"]],
     choices:["requests","dependencies","traces","exceptions"],
     hint:`Incoming work = request. Outgoing call = dependency.`,
     why:`Server and Consumer spans represent work the service receives (requests); Client, Producer and Internal spans represent work it initiates (dependencies). Log records become traces, and recorded exceptions become exceptions.`},
    {id:"dt3", type:"kql", title:"Everything in one operation",
     q:`A customer sends you operation ID <code>0af7651916cd43dd8448eb211c80319c</code>. Return all <b>requests, dependencies and exceptions</b> of that operation in <b>chronological order</b> (oldest first). Show at least <code>timestamp</code>, <code>itemType</code>, <code>name</code> and <code>cloud_RoleName</code>.${sch("requests / dependencies / exceptions (common columns)", ["timestamp:datetime","itemType:string","name:string","operation_Id:string","operation_ParentId:string","id:string","cloud_RoleName:string","duration:real"])}`,
     starter:``,
     checks:[
       {l:"Combines requests, dependencies and exceptions with union", t:q => q.table.startsWith("union") && ["requests","dependencies","exceptions"].every(t => new RegExp(`\\b${t}\\b`).test(q.table))},
       {l:'Filters operation_Id == "0af7651916cd43dd8448eb211c80319c"', t:q => q.where('operation_Id == "0af7651916cd43dd8448eb211c80319c"','operation_Id =~ "0af7651916cd43dd8448eb211c80319c"')},
       {l:"Sorted by timestamp ascending", t:q => q.sortedAsc("timestamp")},
       {l:"Projects timestamp, itemType, name, cloud_RoleName", t:q => q.st("project").some(s => ["timestamp","itemtype","name","cloud_rolename"].every(c => s.items.some(i => i.e === c || i.alias === c)))}
     ],
     cols:["timestamp","itemType","operation_Id","cloud_RoleName"],
     solution:`union requests, dependencies, exceptions
| where operation_Id == "0af7651916cd43dd8448eb211c80319c"
| project timestamp, itemType, name, cloud_RoleName, id, operation_ParentId, duration
| order by timestamp asc`,
     accept:[`union exceptions, requests, dependencies | where operation_Id == '0af7651916cd43dd8448eb211c80319c' | sort by timestamp asc | project timestamp, itemType, name, cloud_RoleName`],
     reject:[`union requests, dependencies, exceptions | where operation_Id == "0af7651916cd43dd8448eb211c80319c" | project timestamp, itemType, name, cloud_RoleName | order by timestamp`,
             `requests | where operation_Id == "0af7651916cd43dd8448eb211c80319c" | project timestamp, itemType, name, cloud_RoleName | order by timestamp asc`],
     hint:`<code>union</code> several tables, filter on the shared ID, and remember that <code>order by</code> is <b>descending</b> unless you say <code>asc</code>.`,
     why:`Every item in a distributed operation shares <code>operation_Id</code>, so one filter over a <code>union</code> rebuilds the whole transaction, which is the query behind the end-to-end transaction view. <code>order by</code> defaults to <code>desc</code>, so chronological order needs <code>asc</code>.`},
    {id:"dt4", type:"mc", title:"Broken chain",
     q:`The web front end calls the payments API through a custom TCP client. In Application Insights, each call shows up as <b>two separate transactions</b>, one per service, and Application Map has no arrow between them. What's the cause?`,
     options:[
       "Trace context (traceparent) isn't propagated over that call, so the payments API starts a new operation",
       "The payments API has sampling enabled",
       "The two services use different Log Analytics workspaces",
       "Live Metrics is disabled on the front end"],
     answer:0,
     hint:`What carries the operation ID from one process to the next?`,
     why:`Correlation only works if the caller sends the trace context and the callee reads it. Automatic instrumentation does that for supported HTTP clients and messaging libraries; a custom protocol needs manual propagation. Different resources or workspaces still correlate as long as the context flows.`},
    {id:"dt5", type:"mc", title:"Who is the parent?",
     q:`Front end <b>web</b> calls <b>orders-api</b> over HTTP. Which statement about the request recorded by <b>orders-api</b> is correct?`,
     options:[
       "Its operation_ParentId equals the id of the dependency recorded by web for that call",
       "Its operation_ParentId equals its own id",
       "Its operation_Id is newly generated by orders-api",
       "Its operation_ParentId is empty, because only the first request has a parent"],
     answer:0,
     hint:`The caller's outgoing span is the parent of the callee's incoming span.`,
     why:`<b>web</b> records the outgoing call as a dependency with its own <code>id</code>, sends that as the parent-id in <code>traceparent</code>, and <b>orders-api</b> stores it as <code>operation_ParentId</code> on its request. The <code>operation_Id</code> is inherited, not regenerated.`}
  ]
},

{
  group:"Query with KQL",
  title:"KQL basics",
  tag:"where · project · extend · take · order by · top · ago()",
  intro:`A KQL query starts with a <b>table</b> and pipes rows through <b>operators</b> with <code>|</code>. Each operator gets the previous result. Filter early, shape late.`,
  sections:[
    {h:"The operators you need first", lang:"kql", code:`requests                                  // table
| where timestamp > ago(1h)               // filter rows; ago() = now minus a timespan
| where success == false and resultCode == "500"
| extend durationSec = duration / 1000.0  // add a calculated column
| project timestamp, name, durationSec, operation_Id   // keep / rename columns
| order by durationSec desc               // sort (default is desc!), synonym: sort by
| take 20                                 // any 20 rows, synonym: limit`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>You want</th><th>Write</th></tr>
<tr><td>N rows sorted by a column</td><td><code>top 10 by duration</code> (descending by default), same as <code>order by duration desc | take 10</code></td></tr>
<tr><td>Any N rows to look at the data</td><td><code>take 10</code>: no ordering guarantee</td></tr>
<tr><td>Drop or rename columns</td><td><code>project-away customDimensions</code>, <code>project-rename Op = name</code></td></tr>
<tr><td>Time windows</td><td><code>ago(15m)</code>, <code>ago(1d)</code>, <code>between (ago(2d) .. ago(1d))</code>, <code>startofday(now())</code></td></tr>
</table></div>`},
    {h:"Comparing strings", after:`<div class="tablewrap"><table class="ref">
<tr><th>Operator</th><th>Meaning</th><th>Case</th></tr>
<tr><td><code>==</code> / <code>!=</code></td><td>Equals / not equals</td><td>Sensitive</td></tr>
<tr><td><code>=~</code> / <code>!~</code></td><td>Equals / not equals</td><td>Insensitive</td></tr>
<tr><td><code>has</code></td><td>Contains a whole <b>term</b> (words split on non-alphanumeric characters); fast, uses the index</td><td>Insensitive</td></tr>
<tr><td><code>contains</code></td><td>Contains the substring anywhere; slower</td><td>Insensitive</td></tr>
<tr><td><code>startswith</code> / <code>endswith</code></td><td>Prefix / suffix</td><td>Insensitive</td></tr>
<tr><td><code>in</code> / <code>in~</code></td><td>Equals one of a list</td><td>Sensitive / insensitive</td></tr>
</table></div>
<p>Table names, column names, operators and function names are case-sensitive in KQL: <code>Where</code> or <code>Timestamp</code> fail. Severity levels in <code>traces</code>/<code>exceptions</code>: 0 Verbose, 1 Information, 2 Warning, 3 Error, 4 Critical.</p>`}
  ],
  tip:`Recognise <code>where</code> = filter rows, <code>project</code> = choose columns, <code>extend</code> = add a column, <code>summarize</code> = aggregate. A query that uses <code>take</code> to get "the latest" or "the slowest" rows is wrong: it needs <code>top</code> or <code>order by</code>.`,

| [[3]] 10`,

`,

| where timestamp > ago(24h)

`,

       {l:"extend a percentage with floating-point maths (100.0 * … / … or todouble())", t:q => { const i = q.idx("summarize"); return q.main.some((s, k) => k > i && s.op === "extend" && s.items.some(it => it.alias && /\//.test(it.e) && /100\.0|todouble|toreal|1\.0\*/.test(it.e))); }},

| summarize Total = count(), Failed = countif(success == false) by name
| extend FailurePct = round(100.0 * Failed / Total, 2)
| order by FailurePct desc`,

{
  group:"Query with KQL",
  title:"Join, let, series & infra tables",
  tag:"join · let · make-series · Perf · Heartbeat · AzureActivity · cross-resource",
  intro:`Real investigations combine tables: failed requests with their failing dependencies, machines with their last heartbeat, deletes with their caller. This module adds <code>let</code>, <code>join</code>, <code>make-series</code> and the Log Analytics infrastructure tables.`,
  sections:[
    {h:"let and join", lang:"kql", code:`let window = 1h;                              // a scalar
let failedDeps = dependencies                  // a tabular expression
    | where timestamp > ago(window) and success == false
    | project operation_Id, target, depResult = resultCode;
requests
| where timestamp > ago(window) and success == false
| join kind=inner (failedDeps) on operation_Id
| summarize count() by name, target
// different key names on each side:
//   | join kind=inner (dependencies) on $left.id == $right.operation_ParentId`,
     after:`<div class="tablewrap"><table class="ref">
<tr><th>join kind</th><th>Returns</th></tr>
<tr><td><code>innerunique</code> (the default!)</td><td>Matches, but duplicate keys on the <b>left</b> side are removed first</td></tr>
<tr><td><code>inner</code></td><td>Every matching left/right pair</td></tr>
<tr><td><code>leftouter</code></td><td>All left rows, with right columns where there's a match (empty otherwise)</td></tr>
<tr><td><code>leftanti</code></td><td>Left rows that have <b>no</b> match on the right</td></tr>
<tr><td><code>leftsemi</code></td><td>Left rows that <b>do</b> have a match (left columns only)</td></tr>
</table></div>
<p>Columns that exist on both sides get a suffix on the right side: <code>name1</code>, <code>timestamp1</code>…</p>`},
    {h:"make-series", lang:"kql", code:`requests
| make-series Requests = count() default=0 on timestamp from ago(7d) to now() step 1h
| render timechart`,
     p:`Unlike <code>summarize … by bin()</code>, <code>make-series</code> creates a value for <b>every</b> step, filling empty buckets with the <code>default</code>. That's what you need for gap-free charts and for the series functions used in anomaly detection (<code>series_decompose_anomalies()</code>).`},
    {h:"Infrastructure queries", lang:"kql", code:`// machines that stopped reporting
Heartbeat
| summarize LastSeen = max(TimeGenerated) by Computer
| where LastSeen < ago(15m)

// available memory per computer (Windows counter)
Perf
| where ObjectName == "Memory" and CounterName == "Available MBytes"
| summarize avg(CounterValue) by bin(TimeGenerated, 15m), Computer

// who deleted what, from the activity log
AzureActivity
| where OperationNameValue endswith "/delete"
| project TimeGenerated, Caller, OperationNameValue, ResourceGroup, _ResourceId

// several Application Insights resources at once
union app("web-prod").requests, app("api-prod").requests
| summarize count() by cloud_RoleName`}
  ],
  tip:`"Rows in A with no match in B" → <code>leftanti</code>. "Reuse a value or subquery" → <code>let</code>. "Machines not reporting" → <code>Heartbeat</code> + <code>max(TimeGenerated)</code>. "Who changed / deleted a resource" → <code>AzureActivity</code> (<code>Caller</code>). "Query across Application Insights resources" → <code>app()</code> (or <code>workspace()</code>).`,
  exercises:[
    {id:"jn1", type:"kql", title:"Failed requests + failed dependencies",
     q:`For the last <b>hour</b>, join failed requests to the failed dependency calls of the <b>same operation</b> using <code>join kind=inner</code>, then count the matches per request <code>name</code> and dependency <code>target</code>.${sch("requests", S_REQUESTS)}${sch("dependencies", S_DEPS)}`,
     starter:`requests
`,
     checks:[
       {l:"requests filtered to the last hour and failed", t:q => q.table === "requests" && q.where(...TIME("timestamp","1h")) && q.where(...FAILED("success"))},
       {l:"join kind=inner on operation_Id", t:q => q.st("join").some(s => /^join kind=inner\(/.test(s.s) && (s.s.endsWith("on operation_id") || s.s.endsWith("on $left.operation_id==$right.operation_id")))},
       {l:"Right side: dependencies, last hour, failed", t:q => { const r = q.sub("join"); const ok = r.table === "dependencies" && r.where(...TIME("timestamp","1h")) && r.where(...FAILED("success")); if (ok) return true;
          // or a let-defined subquery
          const name = (q.st("join")[0] || {s:""}).s.match(/^join kind=inner\((\w+)\)/); if (!name || !q.lets[name[1]]) return false;
          const l = kqlApi(q.lets[name[1]]); return l.table === "dependencies" && l.where(...TIME("timestamp","1h")) && l.where(...FAILED("success")); }},
       {l:"summarize count() by name, target (after the join)", t:q => q.before("join","summarize") && q.sum([["count()"]], ["name","target"])}
     ],
     cols:["requests","dependencies","timestamp","success","operation_Id","name","target"],
     solution:`requests
| where timestamp > ago(1h) and success == false
| join kind=inner (
    dependencies
    | where timestamp > ago(1h) and success == false
  ) on operation_Id
| summarize count() by name, target`,
     accept:[`let deps = dependencies | where timestamp > ago(1h) | where success == false;
requests | where timestamp > ago(1h) | where success == false | join kind=inner (deps) on operation_Id | summarize Failures = count() by target, name`,
             `requests | where timestamp > ago(1h) and not(success) | join kind=inner (dependencies | where timestamp > ago(1h) and success == false) on $left.operation_Id == $right.operation_Id | summarize count() by name, target`],

     hint:`<code>| join kind=inner ( dependencies | where … ) on operation_Id</code>. The dependency's <code>name</code> becomes <code>name1</code>, so <code>name</code> still means the request.`,
     why:`Both tables share <code>operation_Id</code>, so the join pairs each failed request with the failed calls made during it. <code>kind=inner</code> keeps every pair; the default <code>innerunique</code> would de-duplicate the left side first. Filtering both sides before the join keeps it small and fast.`},
    {id:"jn2", type:"kql", title:"A threshold with let",
     q:`Define a <code>let</code> variable holding the threshold <b>2000</b> (ms), then count requests from the last <b>hour</b> that are slower than it, per <code>name</code>.${sch("requests", S_REQUESTS)}`,
     starter:`let `,
     checks:[
       {l:"let <name> = 2000;", t:q => Object.values(q.lets).some(v => v === "2000")},
       {l:"Last hour", t:q => q.where(...TIME("timestamp","1h"))},
       {l:"where duration > <your variable>", t:q => Object.keys(q.lets).some(n => q.lets[n] === "2000" && q.where(`duration > ${n}`))},

`,

     options:[
